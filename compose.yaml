services:
  postgres:
    image: postgres:17
    container_name: sprintforge-postgres
    environment:
    POSTGRES_DB: ${DB_NAME:-sprintforge}
    POSTGRES_USER: ${DB_USER:-sprintforge}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - sprintforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintforge -d sprintforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sprintforge-postgres-data:
